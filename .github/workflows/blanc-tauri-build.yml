name: Blanc Tauri Production CI & Matrix Build

on:
  push:
    branches: [main]
    paths:
      - 'blanc-tauri/**'
      - '.github/workflows/blanc-tauri-build.yml'
  pull_request:
    paths:
      - 'blanc-tauri/**'
      - '.github/workflows/blanc-tauri-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Test-Sign Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build frontend verification
        working-directory: blanc-tauri
        run: npm run build

      - name: Run test & lint verification
        working-directory: blanc-tauri
        run: |
          npm run lint
          npm run test:unit

      - name: Build native Tauri desktop binary
        working-directory: blanc-tauri
        run: npx @tauri-apps/cli build

      - name: Sign Windows Binaries with Test Certificate
        shell: pwsh
        working-directory: blanc-tauri
        run: ./scripts/sign-windows-test.ps1 -TargetDir "src-tauri/target/release"

      - name: Upload Signed Windows Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blanc-tauri-windows-x64-signed
          path: |
            blanc-tauri/src-tauri/target/release/bundle/**
            blanc-tauri/src-tauri/target/release/*.exe
          if-no-files-found: warn

  build-linux-macos:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact-name: 'blanc-tauri-linux-x64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact-name: 'blanc-tauri-macos-arm64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build frontend verification
        working-directory: blanc-tauri
        run: npm run build

      - name: Run test & lint verification
        working-directory: blanc-tauri
        run: |
          npm run lint
          npm run test:unit

      - name: Build native Tauri desktop binary
        working-directory: blanc-tauri
        run: npx @tauri-apps/cli build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            blanc-tauri/src-tauri/target/release/bundle/**
            blanc-tauri/src-tauri/target/release/blanc-tauri*
          if-no-files-found: warn

  build-android-splits:
    name: Build & Sign Android (Split per ABI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-linux-android'
            tauri_target: 'aarch64'
            abi: 'arm64-v8a'
          - target: 'armv7-linux-androideabi'
            tauri_target: 'armv7'
            abi: 'armeabi-v7a'
          - target: 'x86_64-linux-android'
            tauri_target: 'x86_64'
            abi: 'x86_64'
          - target: 'i686-linux-android'
            tauri_target: 'i686'
            abi: 'x86'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Java 17
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Discovered NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build Frontend Assets
        working-directory: blanc-tauri
        run: npm run build

      - name: Initialize Android Target (if needed)
        working-directory: blanc-tauri
        run: |
          if [ ! -d "src-tauri/gen/android/app/src/main/java" ]; then
            rm -rf src-tauri/gen/android
            npx @tauri-apps/cli android init --ci
            chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          fi

      - name: Generate Release Keystore
        working-directory: blanc-tauri
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/release.keystore \
            -alias blanc-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "BlancAndroidPass2026!" \
            -keypass "BlancAndroidPass2026!" \
            -dname "CN=Blanc Browser, O=Bananify Creative, C=US"

      - name: Build Android APK for ABI (${{ matrix.abi }})
        working-directory: blanc-tauri
        run: |
          npx @tauri-apps/cli android build --ci --target ${{ matrix.tauri_target }} --apk --split-per-abi

      - name: Align and Sign APK with apksigner (v2 & v3 Signature Schemes)
        working-directory: blanc-tauri
        run: |
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          find src-tauri/gen/android -name "*.apk" | while read -r apk; do
            echo "Aligning $apk..."
            "$ZIPALIGN" -p -f 4 "$apk" "${apk}.aligned"
            mv "${apk}.aligned" "$apk"

            echo "Signing $apk with apksigner (v1, v2, v3)..."
            "$APKSIGNER" sign \
              --ks keystore/release.keystore \
              --ks-pass "pass:BlancAndroidPass2026!" \
              --key-pass "pass:BlancAndroidPass2026!" \
              --ks-key-alias blanc-release \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"

            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload Signed Split APK (${{ matrix.abi }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blanc-tauri-android-${{ matrix.abi }}-signed
          path: |
            blanc-tauri/src-tauri/gen/android/**/*.apk
          if-no-files-found: warn

  publish-release:
    name: Publish Production GitHub Release
    needs: [build-windows, build-linux-macos, build-android-splits]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all built artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-artifacts

      - name: Stage Release Assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "blanc-tauri" \) | while read -r file; do
            echo "Staging $file..."
            cp "$file" dist-release/
          done
          echo "Staged assets:"
          ls -la dist-release/

      - name: Generate Release Notes & Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v0.1.0-tauri"
          RELEASE_TITLE="Blanc Browser v0.1.0 (Native Tauri v2 Core)"

          cat << 'EOF' > release_notes.md
          ## Blanc Browser v0.1.0 — Native Tauri v2 Production Baseline

          Blanc has transitioned to a high-performance **Tauri v2** native core architecture, combining the signature **Floating Island** command pill with deep OS-level isolation, sub-millisecond memory footprint, and hardened security.

          ### What's New & Highlights

          - **Floating Island Chrome:** Custom-drawn floating navigation capsule with intelligent URL bar, integrated tab switcher, and quick switcher modal.
          - **Multi-Webview Isolation:** Native multi-webview tab management anchored at $(X=16\text{px}, Y=80\text{px})$, providing true process boundary isolation for web content.
          - **Network-Level Ad & Tracker Blocking:** Integrated Rust domain filter running before request dispatch to safeguard user privacy.
          - **Built-in System Pages:** Clean internal management for `blanc://newtab`, `blanc://history`, `blanc://bookmarks`, and `blanc://settings`.
          - **Zero-Flicker Window Vibrancy & Controls:** Frameless window controls with native resize listeners and persistence.

          ### Platform Artifacts & Verification

          - **Windows (x64):** Test-signed NSIS installer and standalone executable (`.exe`) verified with `signtool`.
          - **Android (Split per ABI):** Release APKs signed with release keystore and split per target architecture:
            - `arm64-v8a` (Modern 64-bit ARM devices)
            - `armeabi-v7a` (32-bit ARM legacy devices)
            - `x86_64` (64-bit emulators & Chromebooks)
            - `x86` (32-bit x86 environments)
          - **macOS (Apple Silicon arm64):** Native `.dmg` / application bundle.
          - **Linux (x64):** Standalone `.AppImage` and `.deb` distribution packages.

          ---
          *Built and verified via automated GitHub Actions CI/CD matrix build.*
          EOF

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing release $VERSION..."
            gh release upload "$VERSION" dist-release/* --clobber --repo "$GITHUB_REPOSITORY" || true
            gh release edit "$VERSION" --title "$RELEASE_TITLE" --notes-file release_notes.md --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" dist-release/* \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
