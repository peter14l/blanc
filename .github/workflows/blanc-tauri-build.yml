name: Blanc Tauri Production CI & Matrix Build

on:
  push:
    branches: [main]
    paths:
      - 'blanc-tauri/**'
      - '.github/workflows/blanc-tauri-build.yml'
  pull_request:
    paths:
      - 'blanc-tauri/**'
      - '.github/workflows/blanc-tauri-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Test-Sign Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build frontend verification
        working-directory: blanc-tauri
        run: npm run build

      - name: Build native Tauri desktop binary
        working-directory: blanc-tauri
        run: npx @tauri-apps/cli build

      - name: Sign Windows Binaries with Test Certificate
        shell: pwsh
        working-directory: blanc-tauri
        run: ./scripts/sign-windows-test.ps1 -TargetDir "src-tauri/target/release"

      - name: Upload Signed Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blanc-tauri-windows-x64-signed
          path: |
            blanc-tauri/src-tauri/target/release/bundle/**
            blanc-tauri/src-tauri/target/release/*.exe
          if-no-files-found: warn

  build-linux-macos:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact-name: 'blanc-tauri-linux-x64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact-name: 'blanc-tauri-macos-arm64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build frontend verification
        working-directory: blanc-tauri
        run: npm run build

      - name: Build native Tauri desktop binary
        working-directory: blanc-tauri
        run: npx @tauri-apps/cli build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            blanc-tauri/src-tauri/target/release/bundle/**
            blanc-tauri/src-tauri/target/release/blanc-tauri*
          if-no-files-found: warn

  build-android-splits:
    name: Build & Sign Android (Split per ABI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-linux-android'
            tauri_target: 'aarch64'
            abi: 'arm64-v8a'
          - target: 'armv7-linux-androideabi'
            tauri_target: 'armv7'
            abi: 'armeabi-v7a'
          - target: 'x86_64-linux-android'
            tauri_target: 'x86_64'
            abi: 'x86_64'
          - target: 'i686-linux-android'
            tauri_target: 'i686'
            abi: 'x86'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'blanc-tauri/package-lock.json'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" || /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Discovered NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        working-directory: blanc-tauri
        run: npm ci

      - name: Build Frontend Assets
        working-directory: blanc-tauri
        run: npm run build

      - name: Generate Release Keystore
        working-directory: blanc-tauri
        run: |
          mkdir -p src-tauri/gen/android
          keytool -genkey -v \
            -keystore src-tauri/gen/android/release.keystore \
            -alias blanc-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "BlancAndroidPass2026!" \
            -keypass "BlancAndroidPass2026!" \
            -dname "CN=Blanc Browser, O=Bananify Creative, C=US"

      - name: Initialize Android Target (if needed)
        working-directory: blanc-tauri
        run: |
          if [ ! -d "src-tauri/gen/android" ] || [ ! -f "src-tauri/gen/android/build.gradle.kts" ]; then
            npx @tauri-apps/cli android init --ci || true
            chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          fi

      - name: Build Android APK for ABI (${{ matrix.abi }})
        working-directory: blanc-tauri
        run: |
          npx @tauri-apps/cli android build --ci --target ${{ matrix.tauri_target }} --apk --split-per-abi

      - name: Sign APK with Release Keystore
        working-directory: blanc-tauri
        run: |
          find src-tauri/gen/android -name "*.apk" | while read -r apk; do
            echo "Signing $apk..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore src-tauri/gen/android/release.keystore \
              -storepass "BlancAndroidPass2026!" \
              -keypass "BlancAndroidPass2026!" \
              "$apk" blanc-release || true
          done

      - name: Upload Signed Split APK (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: blanc-tauri-android-${{ matrix.abi }}-signed
          path: |
            blanc-tauri/src-tauri/gen/android/**/*.apk
          if-no-files-found: warn
