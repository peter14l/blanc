name: Android CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'android-*'
    paths:
      - 'blanc-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blanc-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag Name (e.g. android-v1.0.0)'
        required: false
        default: 'android-v1.0.0'
        type: string

env:
  GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          cmdline-tools-version: 'latest'
          emulator: false
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x blanc-android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('blanc-android/**/*.gradle*', 'blanc-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Split Release APKs
        working-directory: blanc-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: blanc-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        working-directory: blanc-android
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Lint
        working-directory: blanc-android
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Split Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: blanc-android-split-release-apks
          path: blanc-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: blanc-debug-apk
          path: blanc-android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: blanc-android/app/build/reports/lint-results-debug.html
          retention-days: 7

  build-release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    needs: build
    permissions:
      contents: write
    
    steps:
      - name: Download Split Release APKs
        uses: actions/download-artifact@v4
        with:
          name: blanc-android-split-release-apks
          path: release-apks

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=android-v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-apks/*.apk
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Blanc Android ${{ steps.tag.outputs.tag }}
          body: |
            ### Blanc Android (${{ steps.tag.outputs.tag }})

            Official release with split APKs per ABI:
            - **`app-arm64-v8a-release.apk`**: 64-bit ARM devices (modern phones & tablets)
            - **`app-armeabi-v7a-release.apk`**: 32-bit ARM devices (legacy phones)
            - **`app-x86_64-release.apk`**: 64-bit Intel/AMD
            - **`app-x86-release.apk`**: 32-bit Intel/AMD
            - **`app-universal-release.apk`**: Universal APK (all architectures)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}