name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'blanc-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blanc-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: # Allow manual trigger

env:
  GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.0.12077973
          build-tools-version: '34.0.0'
          cmdline-tools-version: 'latest'
          emulator: false
          # Don't install deprecated 'tools' package
          # The cmdline-tools 'latest' includes everything needed

      - name: Grant execute permission for gradlew
        run: chmod +x blanc-android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('blanc-android/**/*.gradle*', 'blanc-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: blanc-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        working-directory: blanc-android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Lint
        working-directory: blanc-android
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blanc-debug-apk
          path: blanc-android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: blanc-android/app/build/reports/lint-results-debug.html
          retention-days: 7

  build-release:
    name: Build Release (Tagged)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.0.12077973
          build-tools-version: '34.0.0'
          cmdline-tools-version: 'latest'

      - name: Grant execute permission for gradlew
        run: chmod +x blanc-android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('blanc-android/**/*.gradle*', 'blanc-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release AAB
        working-directory: blanc-android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: blanc-release-aab
          path: blanc-android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: blanc-android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}