[package]
name = "blanc-tauri"
version = "0.3.1"
description = "A lightweight cross-platform browser pairing Blanc's Island UI with Tauri v2"
authors = ["Bananify Creative"]
edition = "2021"

[lib]
name = "blanc_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blanc-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
urlencoding = "2.1"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
# Adblock
aho-corasick = "1.1"
regex = "1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_System_Com"] }
webview2-com = "0.39"
